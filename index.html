  :root{
    --red:#E4322B;      /* bus rosso */
    --blue:#0F2C6B;     /* blu underground */
    --sky:#00A0E2;
    --yellow:#FFD400;
    --pink:#FF5DA2;
    --green:#00A64F;
    --purple:#7B3FE4;
    --ink:#12142B;
    --paper:#FFF8F0;
    --display:'Fredoka', ui-rounded, 'Arial Rounded MT Bold', system-ui, sans-serif;
    --body:system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:var(--body);
    background:var(--ink); color:#fff; overflow:hidden;
  }

  /* ---------- deck ---------- */
  #deck{position:fixed; inset:0;}
  .slide{
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    padding:clamp(20px,4vw,56px);
    padding-bottom:96px;
    opacity:0; transform:translateY(24px) scale(.985);
    transition:opacity .45s ease, transform .45s cubic-bezier(.2,.8,.2,1);
    pointer-events:none; overflow:hidden;
  }
  .slide.on{opacity:1; transform:none; pointer-events:auto;}
  @media (prefers-reduced-motion: reduce){
    .slide{transition:opacity .2s ease; transform:none}
    .act{animation:none !important}
  }

  .veil{position:absolute; inset:0; z-index:1;}
  .body{position:relative; z-index:2; display:flex; flex-direction:column; height:100%;
        text-shadow:0 1px 10px rgba(0,0,0,.35);}

  .scroller{overflow-y:auto; -webkit-overflow-scrolling:touch; padding-right:4px; flex:1;}
  .scroller::-webkit-scrollbar{width:6px}
  .scroller::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25); border-radius:9px}

  /* Slide libere (copertina, fili, chiusura): non hanno .scroller, quindi il
     contenuto più alto dello schermo veniva tagliato. Qui scorre .body stesso.
     Il centraggio verticale si fa con i margini auto e NON con justify-content:
     con flex center il contenuto che sborda diventa irraggiungibile anche in cima. */
  .slide.plain .body{overflow-y:auto; -webkit-overflow-scrolling:touch; padding-right:4px;}
  .slide.plain .body::-webkit-scrollbar{width:6px}
  .slide.plain .body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25); border-radius:9px}
  .slide.plain.centered .body > :first-child{margin-top:auto}
  .slide.plain.centered .body > :last-child{margin-bottom:auto}

  /* ---------- typography ---------- */
  h1{font-family:var(--display); font-weight:700; font-size:clamp(38px,7.5vw,92px); line-height:.98; letter-spacing:-.02em;}

  .acts{margin-top:clamp(14px,2.2vw,26px); display:flex; flex-direction:column; gap:10px;}
  .act{
    display:flex; gap:14px; align-items:flex-start;

    border-radius:16px; padding:13px 15px;

  @keyframes pop{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none}}

    font-size:clamp(10px,1.25vw,12px); font-weight:800; letter-spacing:.03em;

  .b.manu {background:#00C2A8; color:#04322C;}

  .b.giac {background:#B79BFF; color:#241148;}

  /* ---------- chips / grids ---------- */
  .grid{display:grid; gap:12px; margin-top:22px;
        grid-template-columns:repeat(auto-fit,minmax(190px,1fr));}
  .card{background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.16);
        border-radius:18px; padding:16px; backdrop-filter:blur(8px);}

  .card h3{font-family:var(--display); font-weight:600; font-size:19px; margin:8px 0 5px}
  .card p{font-size:14px; opacity:.85; line-height:1.45}

  /* ---------- overview timeline ---------- */
  .tl{display:grid; gap:8px; margin-top:18px;
      grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
  .tlc{background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.16);
       border-radius:14px; padding:11px 12px; cursor:pointer; transition:.18s;}
  .tlc:hover{background:rgba(255,255,255,.2); transform:translateY(-3px)}
  .tlc .n{font-size:11px; font-weight:800; opacity:.7; letter-spacing:.08em}
  .tlc .w{font-family:var(--display); font-weight:600; font-size:15.5px; margin-top:3px; line-height:1.15}
  .tlc .e{float:right; font-size:20px; margin-top:-2px}

  /* ---------- oggi ---------- */
  .todaybadge{display:inline-block; margin-left:8px; padding:3px 8px; border-radius:999px;
    background:var(--yellow); color:#3A2E00; font-size:11px; font-weight:800; letter-spacing:.06em;}
  .tlc.today{outline:2px solid var(--yellow); background:rgba(255,212,0,.16);}
  #todayBtn{height:40px; padding:0 16px; border-radius:999px; border:none;
    background:var(--yellow); color:#3A2E00; font-family:var(--body); font-weight:800;
    font-size:13px; letter-spacing:.04em; cursor:pointer; flex:none; display:none;
    box-shadow:0 4px 16px rgba(0,0,0,.35);}
  #todayBtn:focus-visible{outline:2px solid #fff; outline-offset:2px}

  /* ---------- nav ---------- */
  #bar{position:fixed; left:0; right:0; bottom:0; height:78px; z-index:20;
       display:flex; align-items:center; justify-content:space-between;
       padding:0 clamp(14px,3vw,32px);
       background:linear-gradient(to top, rgba(8,9,20,.85), rgba(8,9,20,0));}
  .nav{width:46px; height:46px; border-radius:50%; border:1px solid rgba(255,255,255,.3);
       background:rgba(255,255,255,.12); color:#fff; font-size:19px; cursor:pointer;
       display:grid; place-items:center; backdrop-filter:blur(8px); transition:.18s; flex:none;}
  .nav:hover{background:#fff; color:var(--ink)}
  .nav:focus-visible{outline:2px solid var(--yellow); outline-offset:2px}
  .nav:disabled{opacity:.25; cursor:default}
  #dots{display:flex; gap:5px; flex-wrap:wrap; justify-content:center; max-width:70%;}
  .dot{width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.3); cursor:pointer; transition:.2s}
  .dot.on{background:#fff; transform:scale(1.6)}
  #prog{position:fixed; top:0; left:0; height:3px; background:var(--yellow); z-index:30; transition:width .4s ease;}
  #hint{position:fixed; bottom:88px; left:50%; transform:translateX(-50%); z-index:19;
        font-size:11.5px; opacity:.5; letter-spacing:.05em; text-align:center;}
  @media(max-width:640px){ #hint{display:none} .slide{padding-bottom:88px} }
</style>
</head>

<div id="bar">

  <div id="dots"></div>
  <button id="todayBtn" aria-label="Vai al giorno corrente">📍 Oggi</button>

</div>

  acts:[
   {i:'☀️',t:'Sole pieno e 28 gradi',d:'La giornata più calda del viaggio finora, e senza una nuvola. Si cammina poco — meno di ieri — ma si sta fuori undici ore: acqua comprata prima di salire sul treno (a bordo non c\'è il bar), cappelli e crema addosso da casa.',w:[T]},
   {i:'🚆',t:'Il treno delle 10:27',d:'Da Stratford International, che è una stazione diversa da Stratford: si passa dentro Westfield per arrivarci. Poi un\'ora e dodici minuti filati e si è al mare.',w:[T,BK]},
   {i:'🌊',t:'Whitstable — la richiesta di Manuela',d:'Mare vero, spiaggia di ciottoli, cabine colorate, barche da pesca. E si arriva venti minuti prima dell\'alta marea: barche a galla, acqua fin sotto le cabine, niente distese di fango. La versione bella di questo posto.',w:[M]},
   {i:'🦪',t:'Il porto, meglio della spiaggia',d:'Whitstable è famosa per le sue ostriche da quando le raccoglievano i Romani. Il mercatino di casette di legno il martedì era chiuso, ma è stato il porto dei pescatori — barche a galla con l\'acqua alta — la cosa più bella della mattina, più della spiaggia stessa.',w:[M,T]},
   {i:'🎬',t:'Pranzo al pub di Peter Cushing',d:'Porta il nome dell\'attore che visse qui — e che fu Dr. Who al cinema negli anni Sessanta, nei due film con i Dalek. Si pranza proprio lì, seduti e al fresco: una sosta che vale doppio. Ma dopo il mare, non prima — l\'acqua alta è a mezzogiorno e non aspetta.',w:[T]},
   {i:'🚌',t:'Bus fino a Canterbury',d:'Si prende nella stessa via del porto, e ne passa uno ogni quarto d\'ora: quaranta minuti tra le campagne del Kent e si cambia mondo.',w:[T]},
   {i:'👖',t:'Whitefriars — i jeans di Manuela',d:'Appena scesi dal bus il centro commerciale era lì a due passi, e si è pranzato mezz\'ora prima apposta per avere il tempo di guardare con calma. Jeans trovati: missione compiuta.',w:[M]},
   {i:'🎓',t:'Canterbury in giorno di lauree',d:'Questa settimana la città laurea i suoi studenti in cattedrale: per le strade medievali ci sono famiglie e ragazzi in toga e tocco. Non era in programma e non si paga: capita.',w:[T]},
   {i:'🛶',t:'Le barchette sullo Stour',d:'Il fiume attraversa il centro medievale e lo girano in barca, spinte con una pertica: si vedono passare dai ponti. A Canterbury gli orari non si incastrano col coro delle cinque e mezza, quindi le guardiamo passare e basta.',w:[A,M]},
   {i:'🏰',t:'I giardini sul fiume, di sera',d:'La più grande porta medievale d\'Inghilterra, con le sue due torri rotonde. I giardini accanto si erano ceduti al pomeriggio per fare i negozi — e ci si è finiti la sera, aspettando il treno: luce lunga, il fiume, e molto meno caldo. Ci si guadagna.',w:[T]},
   {i:'🍰',t:'Merenda da Waterstones',d:'La pausa seduta si è fatta al caffè di una libreria su tre piani: merenda e libri nello stesso posto, senza perdere un minuto. Poi si è passati a prendere qualcosa da mangiare in treno.',w:[T]},
   {i:'🎶',t:'Evensong in Cattedrale — ore 17:30',d:'Quarantacinque minuti di canto, senza biglietto, seduti nel coro: la parte più bella della cattedrale, quella che di giorno si paga per vedere. E stasera canta un coro venuto dall\'Arkansas, in residenza qui per la settimana.',w:[T]},
   {i:'🚆',t:'Il diretto della sera',d:'Da Canterbury West, dodici minuti a piedi dalla cattedrale. Quarantasette minuti di treno, e si cena a bordo la prima parte.',w:[T,BK]},
   {i:'🍝',t:'Pasta a casa',d:'A casa verso le nove meno un quarto, e in tavola la pasta: dopo undici ore fuori e una giornata di sole, la cosa migliore è la propria cucina.',w:[T]},
  ]},

{ day:7, date:'Mercoledì 29 luglio', title:'Liverpool 🎸', emoji:'🐝', short:'Pellegrinaggio Beatles',
  bg:'linear-gradient(135deg,#E4322B,#FFD400)',
  acts:[
   {i:'⏰',t:'Sveglia presta: si esce alle 8 e un quarto',d:'È il giorno con la partenza più mattiniera del viaggio, e il treno non aspetta: i posti sono assegnati e il biglietto vale solo su quello. Colazione a casa, e mezz\'ora di margine a Euston per non correre.',w:[T]},
   {i:'🚆',t:'Due ore e venti verso nord',d:'Posti già assegnati, si legge e si guarda fuori. Stavolta il treno ha anche il bar a bordo. Si riparte da Liverpool alle sette meno un quarto.',w:[T,BK]},
   {i:'🏛️',t:'St George\'s Hall, appena usciti',d:'È proprio davanti alla stazione: colonne enormi, gradinate, uno dei più grandi edifici neoclassici d\'Europa. Cinque minuti senza spostarsi di un metro dal percorso, e Liverpool si presenta così.',w:[T]},
   {i:'🍽️',t:'Pranzo al pub di James Street',d:'La formula di Whitstable ha convinto e si replica: tavolo, ordine dall\'app, piatti semplici. E il pub sta proprio di fronte al palazzo della White Star Line — stavolta, senza nessun bus a mettere fretta.',w:[T]},
   {i:'📸',t:'La statua dei Beatles, tutti insieme',d:'Tutti e quattro che camminano, a grandezza naturale, sul molo davanti al Mersey. Si fa subito dopo pranzo, tutti e tre insieme, senza nessun orario da rispettare: è la foto della giornata.',w:[T]},
   {i:'🚢',t:'Il Titanic, dopo tutto',d:'Il museo marittimo è chiuso per lavori, ma il Titanic a Liverpool è fuori, in strada. Sul molo della statua dei Beatles c\'è l\'obelisco che la città alzò nel 1916 per i trentadue ingegneri rimasti sotto, nella sala macchine, a tenere accese le luci mentre la nave affondava.',w:[M,A]},
   {i:'🏛️',t:'Il palazzo della White Star Line',d:'A tre minuti dal molo, a strisce bianche e rosse: qui c\'erano gli uffici della compagnia del Titanic. La mattina del 15 aprile 1912 la folla lo assediò per sapere chi si fosse salvato, e i nomi dei morti furono letti dal balcone.',w:[M,A]},
   {i:'⚓',t:'Albert Dock & il lungomare',d:'Il porto storico: mattoni rossi, acqua, la ruota panoramica e gli artisti di strada. Qui si sta senza orari.',w:[A,T]},
   {i:'🎫',t:'Il museo dei Beatles — Giacomo da solo',d:'Non quello grande sul molo, ma quello piccolo di Mathew Street: tre piani di roba vera, le chitarre e le batterie che suonavano ad Amburgo, le medaglie di Sgt Pepper, il violoncello bianco. È la collezione di una famiglia di Liverpool. Poco più di un\'ora, non di più: nel frattempo Manuela e Alice hanno il loro pomeriggio.',w:[G,BK]},
   {i:'🛍️',t:'Il pomeriggio delle ragazze: shopping',d:'Mentre Giacomo è al museo dei Beatles, Manuela e Alice risalgono dal porto verso Liverpool ONE e Church Street — che è tutto il centro dei negozi, in mezzo alla strada che fanno comunque. Si guarda con calma: si compra dopo, così i sacchetti vanno dritti sul treno.',w:[M,A]},
   {i:'🤝',t:'Ci si ritrova presto, non a sera',d:'Il museo si chiude in un\'ora e mezza, non in tre: Giacomo esce e le raggiunge, perché i negozi sono a cinque minuti da Mathew Street. Da lì in poi si sta insieme — la giornata è lunga abbastanza senza passarla separati.',w:[T]},
   {i:'🎸',t:'Mathew Street & il Cavern, tutti e tre',d:'Il vicolo dove i Beatles suonavano prima di essere i Beatles: il muro con i nomi, il negozio, la porta del Cavern. Si guarda da fuori e si sta insieme, che è meglio. Per strada c\'è anche Eleanor Rigby, seduta in bronzo con la sporta della spesa.',w:[T]},
   {i:'💇',t:'La frangia, alle quattro in punto',d:'Appuntamento preso da Liverpool per Manuela e Alice, in un salone a due passi da Mathew Street: mezz\'ora, e nel frattempo Giacomo gira l\'isolato. Ci si ritrova all\'angolo e si va a fare la spesa per il treno.',w:[M,A,BK]},
   {i:'🥪',t:'Si cena sul treno',d:'Prima di salire si fa una spesa buona all\'M&S, e alle sette si mangia a bordo con calma: due ore e venti, il tavolino, il tramonto fuori dal finestrino. Si arriva a casa già cenati, e si va a dormire.',w:[T]},
  ]},

{ day:8, date:'Giovedì 30 luglio', title:'La giornata Bowie 🖤', emoji:'🪄', short:'Binario 9¾ + Lightroom + British Museum + Brixton',
  bg:'linear-gradient(135deg,#7B3FE4,#12142B)',
  acts:[
   {i:'🪄',t:'Binario 9¾ — la mattina, tutti e tre',d:'Il carrello incastrato nel muro, dentro King\'s Cross: foto con la sciarpa di Grifondoro, e il negozio è lì accanto. Ci andiamo presto, quando la fila è corta.',w:[A,T]},
   {i:'⛲',t:'Granary Square e la libreria sull\'acqua',d:'Le fontane che ballano, il canale, e Word on the Water: una libreria dentro una chiatta. Tutto a due passi.',w:[T]},
   {i:'🍕',t:'Pizza tutti insieme a King\'s Cross',d:'Deciso sul posto: invece del picnic sui gradoni, pizza da Happy Face, in cima a Granary Square. Un tavolo all\'ombra, e a due passi dal Lightroom.',w:[T]},
   {i:'🖤',t:'Lightroom — David Bowie',d:'Show immersivo, un\'ora. Ci va Giacomo da solo: voi scegliete tra la British Library (gratis, c\'è la galleria dei tesori) e i negozi di Coal Drops Yard.',w:[G,BK]},
   {i:'🏺',t:'British Museum — pomeriggio',d:'Gratis, ingresso prenotato. Mummie e sarcofagi egizi, la Stele di Rosetta, i leoni assiri, e le tavolette d\'argilla della biblioteca di Ninive.',w:[T,BK]},
   {i:'🎨',t:'Brixton — il murale di Bowie',d:'Il ritratto di Aladdin Sane è sul muro di fronte all\'uscita della metro: fiori e biglietti dei fan, da dieci anni. ✅ Visto e fotografato. La casa dove Bowie è nato l\'abbiamo invece lasciata perdere: strada poco tranquilla, si è tornati indietro.',w:[G,T]},
   {i:'🎤',t:'La Brixton Academy (trovata per caso)',d:'Non era in programma: passandoci davanti abbiamo fotografato l\'ingresso. Lì dentro, nell\'aprile del 1990, i Faith No More registrarono il loro concerto dal vivo più famoso.',w:[G,T]},
   {i:'🍝',t:'Si cena a casa: pasta fatta da noi',d:'Merenda seduti appena usciti dal museo, poi Brixton, e torniamo verso le sette e mezza a cuocerci un piatto di pasta. Domani c\'è Oxford: meglio una sera corta.',w:[T]},
  ]},

{ day:9, date:'Venerdì 31 luglio', title:'Oxford 🎓', emoji:'📚', short:'Morse + Harry Potter + le guglie',
  bg:'linear-gradient(135deg,#0A5C3A,#00A64F)',
  acts:[
   {i:'🚆',t:'Un\'ora di treno da Paddington',d:'Si parte col treno delle 09:52 e in cinquantun minuti si è a Oxford. Il biglietto del ritorno è libero: si torna con il treno che ci pare. (La statua di Paddington Bear l\'abbiamo già fotografata.)',w:[T,BK]},
   {i:'🪄',t:'New College — i chiostri di Hogwarts',d:'Prima tappa in città, si entra dal cancello di New College Lane: i chiostri sono i corridoi della scuola, e in giardino c\'è la quercia sotto cui Malfoy viene trasformato in furetto.',w:[A,T]},
   {i:'🍺',t:'Pranzo al Turf Tavern',d:'Il pasto buono della giornata si fa a mezzogiorno: una taverna del 1381 nascosta in un vicolo a due passi dal college, con i cortili all\'aperto. È uno dei pub dell\'ispettore Morse. Ci andiamo presto perché non si può prenotare.',w:[T]},
   {i:'🏛️',t:'I college e le guglie, scendendo',d:'Dal pub si cammina verso sud e si passa davanti a tutto: il Bridge of Sighs, Radcliffe Square con la sua cupola rotonda, lo Sheldonian. La città più "da cartolina" del viaggio, e si vede tutta camminando.',w:[T]},
   {i:'🪄',t:'Christ Church — la Sala Grande, ore 14:10',d:'La sala da pranzo che ha ispirato Hogwarts, e le scale del primo film: visita prenotata, con audioguida (le cuffie ce le prestano loro). Ritrovo al Visitor Centre nel prato alle due in punto.',w:[A,T,BK]},
   {i:'🐑',t:'Alice\'s Shop — proprio di fronte',d:'Uscendo da Christ Church, dall\'altra parte della strada: è il negozio dove la vera Alice — la bambina che ispirò il libro — comprava i dolci. Lewis Carroll ce lo mise dentro come la bottega della Pecora. Si entra, ed è gratis.',w:[A,T]},
   {i:'🕵️',t:'Il giro dei pub dell\'ispettore Morse',d:'Oltre al Turf, camminando verso Christ Church si passa davanti al White Horse — incastrato dentro la libreria di Broad Street — e al Bear Inn, che è del 1242 e ha le pareti tappezzate di cravatte tagliate. In mezzo, la piazzetta acciottolata di Oriel Square, quella che nella serie diventa l\'Oxford degli anni Sessanta.',w:[G,M]},
   {i:'🌆',t:'La terrazza sui tetti, prima del treno',d:'Ultima tappa in alto: la terrazza panoramica sopra il centro commerciale del Westgate, aperta a tutti e senza biglietto. Da lassù si vedono le guglie e le torri di tutta la città — compresa quella di Christ Church, dove siamo stati nel pomeriggio. Un tavolo, qualcosa da bere, e i piedi finalmente fermi.',w:[T]},
   {i:'🍝',t:'Si cena a casa: pasta fatta da noi',d:'Dalla terrazza la stazione è un quarto d\'ora a piedi e il biglietto del ritorno è libero: a casa verso le otto meno un quarto, pasta e serata corta. Domani Portobello comincia presto, e il pasto buono l\'abbiamo già fatto a pranzo.',w:[T]},
  ]},

{ day:10, date:'Sabato 1 agosto', title:'Mercati, Meridiano & West End 🛍️', emoji:'🧭', short:'Portobello → Greenwich → West End',
  bg:'linear-gradient(135deg,#00A64F,#00A0E2)',
  acts:[
   {i:'🛍️',t:'Portobello Road Market (mattina presto)',d:'Il sabato è IL suo giorno: è l\'unico in cui aprono le arcate dell\'antiquariato, quei portoni che sembrano negozi e dentro sono corridoi con decine di banchi. Arrivati presto, girato con calma, e via prima che diventasse calca.',w:[M]},
   {i:'📚',t:'La libreria di Notting Hill',d:'Una traversa del mercato, Blenheim Crescent: al numero 13 c\'è la libreria del film con Julia Roberts e Hugh Grant. Il regista abitava proprio qui dietro e ha scritto la storia sul suo quartiere.',w:[T]},
   {i:'🏘️',t:'Le case colorate di Notting Hill',d:'Lancaster Road ed Elgin Crescent, dentro il mercato stesso: file di case rosa, gialle, celesti. Cinquant\'anni fa era la zona povera di Londra ovest e le dipinsero così per rianimarla.',w:[M,A]},
   {i:'🍁',t:'Holland Park e il Kyoto Garden',d:'Pranzo su una panchina all\'ombra, poi il giardino giapponese regalato da Kyoto nel 1991: carpe koi, cascata e lanterne di pietra.',w:[M,A]},
   {i:'🏰',t:'Melbury Road, le case dei musicisti',d:'Uscendo dal parco: al 29 la torre neogotica del 1881 dove vive Jimmy Page dei Led Zeppelin (nel 1972 la spuntò a David Bowie), e alla porta accanto, al 31, la casa di Robbie Williams. Si guardano da fuori.',w:[G,M]},
   {i:'⛵',t:'Cutty Sark, a Greenwich',d:'L\'ultima nave del tè rimasta al mondo: un veliero del 1869 che faceva Cina-Londra in tre mesi, gareggiando con le altre per portare il primo tè del raccolto.',w:[T]},
   {i:'🧭',t:'La collina del Meridiano',d:'Su per il parco fino alla statua del generale Wolfe: da lassù si vedono Canary Wharf, il fiume e mezza Londra. È la collina da cui si conta l\'ora del mondo — GMT vuol dire proprio Greenwich. E la vista è gratis.',w:[T]},
   {i:'🧙',t:'Le statue di Leicester Square',d:'La piazza dei cinema e delle prime mondiali, con le statue sparse tra gli alberi: Chaplin, Mary Poppins, Mr Bean sulla panchina, Paddington — e Harry Potter in volo sulla Nimbus 2000. Trovata e fotografata.',w:[A,T]},
   {i:'🎸',t:'Soho, tre soste in tre vicoli',d:'Soho Square, dove Paul McCartney ha ancora l\'ufficio. Dean Street, con la targa della casa in cui Karl Marx visse cinque anni in due stanze. E St Anne\'s Court: dentro quel portone si sono registrati Hey Jude, Ziggy Stardust e i primi due album dei Queen. Sullo stesso pianoforte.',w:[G,M]},
   {i:'🍜',t:'Cena a Chinatown: buffet all you can eat',d:'Lanterne rosse, insegne e la scelta più larga di Londra. Si mangia seduti, senza fare la coda col menù in mano: una delle cene che volevamo davvero.',w:[M,T]},
   {i:'✨',t:'Piccadilly Circus accesa',d:'Alle nove, non prima: il sole tramonta alle 20:50 e le insegne fanno il loro effetto solo col buio. Quelle luci sono lì dal 1908 e non si sono mai spente, tranne durante la guerra.',w:[M,T]},
   {i:'⭐',t:'Heddon Street, l\'ultima targa',d:'Risalendo Regent Street, un vicolo sulla destra: qui, una notte di gennaio del 1972, sotto la pioggia e i neon, fu scattata la copertina di Ziggy Stardust. La targa è dedicata a Ziggy, non a Bowie.',w:[G,T]},
  ]},

{ day:11, date:'Domenica 2 agosto', title:'East London & sorpresa Soho ⚡', emoji:'🏟️', short:'Brick Lane + MinaLima + V&A East',
  bg:'linear-gradient(135deg,#FF5DA2,#7B3FE4)',
  acts:[
   {i:'🛍️',t:'Mattina: Brick Lane, un mercato solo',d:'Quello giusto: la vecchia birreria Truman, con il vintage per la maglietta di Giacomo e i dischi di Rough Trade. Il resto della strada si guarda passeggiando: le targhe in bengalese, la moschea che prima era chiesa e poi sinagoga, il forno dei bagel aperto da cinquant\'anni.',w:[G,T]},
   {i:'🎨',t:'Street art e Fournier Street',d:'I muri di Brick Lane cambiano ogni settimana: una galleria a cielo aperto. Per Alice c\'è una caccia: trovare gli Space Invaders, i mosaici pixelati nascosti in alto sugli angoli. Poi le case dei tessitori francesi del Seicento, con i lucernari sui tetti.',w:[A,T]},
   {i:'🧺',t:'Pranzo sulle panchine di Soho Square',d:'Sacchetto del meal deal e ombra nel giardino dove siamo già stati ieri sera. Seduti, con calma.',w:[T]},
   {i:'🪄',t:'Recuperata! House of MinaLima',d:'Ieri era sfumata per un soffio, oggi ci si arriva con una sola fermata di metro: la casa-galleria dei due grafici che hanno disegnato tutta la carta dei film di Harry Potter — la Mappa del Malandrino, le lettere di Hogwarts, la Gazzetta del Profeta. Gratis, e si fotografa tutto.',w:[A]},
   {i:'🎸',t:'Due passi tra le chitarre',d:'Denmark Street, la via dei negozi di musica dove gli Stones incisero il primo disco e i Sex Pistols vivevano sopra il numero 6. E all\'angolo gli schermi giganti dell\'Outernet, che ieri sera ci hanno lasciato a bocca aperta: replay.',w:[G,A]},
   {i:'🖤',t:'Pomeriggio: David Bowie Centre',d:'L\'archivio di Bowie al V&A East Storehouse, aperto al pubblico e gratis. A due passi da casa.',w:[G]},
   {i:'🔎',t:'Il magazzino delle meraviglie',d:'Lo Storehouse non è un museo: è il deposito vero del V&A, tre piani di scaffali con 250.000 oggetti e i restauratori al lavoro sotto gli occhi di tutti. Missione per Alice: trovare l\'oggetto più assurdo e fotografarlo. Merenda al caffè prima di uscire.',w:[A,T]},
   {i:'🎬',t:'Se ne abbiamo voglia: Hitchcock a Leytonstone',d:'Due fermate di metro, senza nemmeno uscire in strada: nell\'atrio della stazione dove Hitchcock nacque ci sono 17 mosaici, uno per film. Si guardano, si fotografano e si riparte. Si decide all\'uscita dal museo: sono tre quarti d\'ora in più, e domani è la giornata grossa.',w:[G,T]},
   {i:'🍝',t:'Cena a casa: la pasta di Giacomo',d:'Si torna presto e ai fornelli ci va Giacomo. Serata corta: domani c\'è la maratona dello Studio Tour.',w:[T]},
  ]},

{ day:12, date:'Lunedì 3 agosto', title:'George Michael & Harry Potter 🪄', emoji:'⚡', short:'Highgate + Studio Tour',
  bg:'linear-gradient(135deg,#3A1B6B,#12142B)',
  acts:[
   {i:'🎤',t:'Highgate, il quartiere di George Michael',d:'Si sale in bus fino al villaggio in cima alla collina. Casa sua, il parco dove portava il cane, la sua panchina: è tutto nello stesso angolo di Londra. L\'ultimo tassello musicale del viaggio.',w:[M,T]},
   {i:'🪑',t:'La panchina in Waterlow Park',d:'Da quando il memoriale davanti a casa è stato tolto, i fan vengono a sedersi qui. Dal giardino in alto si vede la cupola di St Paul\'s in fondo alla città.',w:[M]},
   {i:'⚰️',t:'Highgate Cemetery',d:'Il cimitero vittoriano più bello di Londra: viali di angeli e alberi, mezzo mangiato dall\'edera. Qui riposa George Michael, accanto a sua madre. E anche Karl Marx e Douglas Adams, quello della Guida galattica.',w:[T]},
   {i:'🚌',t:'Giù dalla collina in bus, non a piedi',d:'Semplificazione dell\'ultima sera: sarà il giorno più caldo del viaggio, e la traversata della brughiera esce dal piano. Dal cimitero si scende in bus e metro dritti a Euston, tutti seduti. La vista dall\'alto ce la siamo già presa a Greenwich — oggi le gambe si tengono da parte per stasera.',w:[T]},
   {i:'🍺',t:'Pranzo al pub di Euston, con calma',d:'All\'una e mezza, l\'ora giusta: il Captain Flinders, il Wetherspoon a due passi dai binari — tavolo, ordine dall\'app, la formula che ha funzionato a Whitstable e a Liverpool. Porta il nome dell\'esploratore che diede il nome all\'Australia: la sua tomba era andata perduta proprio sotto la stazione, e l\'hanno ritrovata scavando nel 2019. La statua col suo gatto Trim, sulla banchina, l\'abbiamo già vista passando di qui.',w:[T]},
   {i:'🫖',t:'Il tè da regalo, da Fortnum & Mason',d:'Nel pomeriggio libero a Euston si fa due passi fino a St Pancras, la stazione più bella di Londra: Fortnum & Mason ha un negozio dentro l\'Arcade, ed è lì che si compra la scatola di tè da portare a casa. Nella stessa stazione si prende anche il sacchetto del picnic per stasera — un giro solo, dieci minuti a piedi.',w:[M,T]},
   {i:'🧺',t:'La cena si fa dentro, al Backlot',d:'Niente cena di corsa alle cinque: si porta il picnic comprato a St Pancras e si cena a metà tour, seduti ai tavoli del Backlot davanti al Nottetempo e a Privet Drive — alla nostra ora di sempre. Portarsi il cibo lì è permesso, lo dicono le regole del tour. E la Burrobirra fa da dolce.',w:[T]},
   {i:'🪄',t:'Warner Bros. Studio Tour — ore 18:30',d:'I set veri dei film: la Sala Grande, Diagon Alley, il Nottetempo, la Foresta Proibita. Il pezzo grosso del viaggio.',w:[A,T,BK]},
   {i:'🌙',t:'Rientro a mezzanotte',d:'Si torna tardi e felici. Ultimo grande colpo.',w:[T]},
  ]},

{ day:13, date:'Martedì 4 agosto', title:'Ultimo giro, poi casa ✈️', emoji:'🦖', short:'South Kensington → volo',
  bg:'linear-gradient(135deg,#E4322B,#7B3FE4)',
  acts:[

{ bg:'linear-gradient(135deg,#0F2C6B,#E4322B)',
  html:`<div class="body" style="justify-content:center">

    </div>
    <div style="margin-top:26px; font-size:38px; letter-spacing:8px">🇬🇧 ❤️</div>
  </div>`},
];

/* ============ build ============ */
const deck = document.getElementById('deck');
const dots = document.getElementById('dots');
const dayIdx = {};   /* numero giorno → indice slide */

function actHTML(a){
  return `<div class="act"><div class="ico">${a.i}</div><div class="txt">
    <div class="t">${a.t}</div><div class="d">${a.d}</div>
    <div class="who">${a.w.join('')}</div></div></div>`;
}

SLIDES.forEach((s,idx)=>{
  const el = document.createElement('section');
  el.className='slide';
  const veil = `<div class="veil" style="background:${s.bg}; opacity:.85"></div>`;

  let inner;
  if(s.html){ inner = s.html; }
  else {
    dayIdx[s.day] = idx;
    inner = `<div class="body">
      <div class="dayhead">
        <div class="num">${s.day}</div>
        <div><div class="date">${s.date}${s.day===todayN?'<span class="todaybadge">OGGI</span>':''}</div><h2 style="margin-top:2px">${s.title}</h2></div>
        <div class="emoji">${s.emoji}</div>
      </div>
      <div class="scroller"><div class="acts">
        ${s.acts.map(actHTML).join('')}
      </div></div>
    </div>`;
  }
  el.innerHTML = veil + inner;

  /* Slide senza .scroller: si fa scorrere .body. Il justify-content:center
     inline va tolto (impedisce di raggiungere il contenuto che sborda in alto)
     e sostituito dai margini auto della regola .plain.centered. */
  if(!el.querySelector('.scroller')){
    el.classList.add('plain');
    const b = el.querySelector('.body');
    if(b && /justify-content\s*:\s*center/.test(b.getAttribute('style')||'')){
      b.style.justifyContent='';
      el.classList.add('centered');
    }
  }

  deck.appendChild(el);

  const d=document.createElement('div'); d.className='dot';
  d.onclick=()=>go(idx); dots.appendChild(d);
});

/* overview grid links */
const tg=document.getElementById('tlgrid');
SLIDES.forEach((s,i)=>{
  if(!s.day) return;
  const c=document.createElement('div'); c.className='tlc'+(s.day===todayN?' today':'');
  c.innerHTML=`<div class="e">${s.emoji}</div><div class="n">GIORNO ${s.day} · ${s.date.split(' ')[0].toUpperCase()} ${s.date.split(' ')[1]}${s.day===todayN?' · OGGI':''}</div><div class="w">${s.short}</div>`;
  c.onclick=()=>go(i); tg.appendChild(c);
});

/* ============ nav ============ */
let cur=0;
const slides=[...document.querySelectorAll('.slide')];
const dotEls=[...document.querySelectorAll('.dot')];
function go(i){
  cur=Math.max(0,Math.min(SLIDES.length-1,i));
  slides.forEach((s,k)=>s.classList.toggle('on',k===cur));
  dotEls.forEach((d,k)=>d.classList.toggle('on',k===cur));
  document.getElementById('prog').style.width=((cur+1)/SLIDES.length*100)+'%';
  document.getElementById('prev').disabled=cur===0;
  document.getElementById('next').disabled=cur===SLIDES.length-1;
  slides[cur].querySelectorAll('.act').forEach((a,k)=>a.style.animationDelay=(k*.07)+'s');
  const sc=slides[cur].querySelector('.scroller') || slides[cur].querySelector('.body'); if(sc) sc.scrollTop=0;
  /* pulsante "Oggi": visibile solo in viaggio e fuori dalla slide del giorno */
  const tb=document.getElementById('todayBtn');
  tb.style.display=(dayIdx[todayN]!==undefined && cur!==dayIdx[todayN])?'block':'none';
}
document.getElementById('todayBtn').onclick=()=>go(dayIdx[todayN]);
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' ') {e.preventDefault(); go(cur+1);}
  if(e.key==='ArrowLeft') go(cur-1);
  if(e.key==='Home') go(0);
  if(e.key==='End') go(SLIDES.length-1);
});
let sx=0,sy=0;
document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX; sy=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5) go(cur+(dx<0?1:-1));
},{passive:true});

/* ============ avvio: compagno di viaggio ============
   In viaggio → si apre sul giorno corrente; prima → copertina; dopo → chiusura. */
go(dayIdx[todayN]!==undefined ? dayIdx[todayN] : (todayN>13 ? SLIDES.length-1 : 0));
</script>
</body>
</html>
